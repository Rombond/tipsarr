# Local build and run of the single Tipsarr image (frontend embedded in the Go binary).
# From the repo root:
#
#   docker compose -f deployments/docker-compose.dev.yml up --build
#
# Then open http://localhost:8080. Data (SQLite, caches) lives in the `tipsarr-data` volume.
# Dry-run is ON by default: nothing is ever sent to Radarr/Sonarr until you set
# TIPSARR_DRY_RUN=false (restart required).
services:
  tipsarr:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tipsarr:dev
    container_name: tipsarr-dev
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      TIPSARR_DRY_RUN: ${TIPSARR_DRY_RUN:-true}
      # TIPSARR_JELLYFIN_URL: http://jellyfin:8096   # optional: skips the Jellyfin step of the setup page
      # TIPSARR_DB_URL: postgres://user:pass@host:5432/tipsarr?sslmode=disable   # default: SQLite in /config
    volumes:
      - tipsarr-data:/config

volumes:
  tipsarr-data:
