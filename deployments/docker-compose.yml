# Production: runs the published image (built by the release workflow when a v* tag is pushed).
# To build it yourself instead: `docker build -t ghcr.io/rombond/tipsarr:latest .`
#
#   docker compose -f deployments/docker-compose.yml up -d
#
# Dry-run is ON by default (nothing is sent to Radarr/Sonarr). Turn it off deliberately with
# TIPSARR_DRY_RUN=false, only after trying one real request.
services:
  tipsarr:
    image: ghcr.io/rombond/tipsarr:latest
    container_name: tipsarr
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      TIPSARR_DRY_RUN: ${TIPSARR_DRY_RUN:-true}
      # TIPSARR_JELLYFIN_URL: http://jellyfin:8096
      # TIPSARR_DB_URL: postgres://user:pass@host:5432/tipsarr?sslmode=disable
    volumes:
      - tipsarr-data:/config

volumes:
  tipsarr-data:
