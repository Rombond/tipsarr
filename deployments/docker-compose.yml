# Production deployment — runs the image built and published by CI (a GitHub
# Actions pipeline, not set up yet), rather than building locally. Once that
# pipeline exists it should push to GHCR as ghcr.io/rombond/tipsarr:latest;
# until then, either build/push that tag manually or point `image:` below at
# whatever tag you're using.
#
# Run from the repo root:
#   docker compose -f deployments/docker-compose.yml up -d
#
# SEERR_UPSTREAM is read by nginx at container *start*, so it can be changed
# with a plain restart, no rebuild needed. Every other VITE_* setting is baked
# into the image at build time (see deployments/Dockerfile) — changing one
# means publishing a new image.
services:
  tipsarr:
    image: ghcr.io/rombond/tipsarr:latest
    container_name: tipsarr
    restart: unless-stopped
    ports:
      - '3000:80'
    environment:
      SEERR_UPSTREAM: ${VITE_SEERR_URL}
