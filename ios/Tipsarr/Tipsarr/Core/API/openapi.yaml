components:
  schemas:
    Add_blocklistRequest:
      properties:
        tmdbId:
          format: int64
          minimum: 1
          type: integer
        type:
          enum:
            - movie
            - tv
          type: string
      required:
        - type
        - tmdbId
      type: object
    Add_watchlistRequest:
      properties:
        tmdbId:
          format: int64
          minimum: 1
          type: integer
        type:
          enum:
            - movie
            - tv
          type: string
      required:
        - type
        - tmdbId
      type: object
    AdminTeaserHistoryResponse:
      properties:
        items:
          items:
            $ref: "#/components/schemas/HistoryItem"
          type: array
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    ApproveRequestRequest:
      properties:
        qualityProfileId:
          format: int64
          type: integer
        rootFolder:
          type: string
      type: object
    ArrLink:
      properties:
        kind:
          enum:
            - radarr
            - sonarr
          type: string
        name:
          type: string
        url:
          type: string
      required:
        - kind
        - name
        - url
      type: object
    AuthMethods:
      properties:
        password:
          description: The Jellyfin username/password form works
          type: boolean
        sso:
          description: Single sign-on (OpenID Connect) is set up
          type: boolean
        ssoLabel:
          description: Name of the provider for the button
          type: string
      required:
        - password
        - sso
      type: object
    Breaker:
      properties:
        state:
          enum:
            - closed
            - open
          type: string
        until:
          format: int64
          type: integer
      required:
        - state
        - until
      type: object
    CastMember:
      properties:
        character:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
        profilePath:
          type: string
      required:
        - id
        - name
      type: object
    Chart:
      properties:
        end:
          type: string
        entries:
          items:
            $ref: "#/components/schemas/ChartEntry"
          type: array
        fetchedAt:
          format: int64
          type: integer
        hasWeekly:
          description: Weekly charts are stored for this region
          type: boolean
        label:
          type: string
        region:
          type: string
        regions:
          items:
            type: string
          type: array
        start:
          type: string
        week:
          description: Week key, e.g. 2026W40; empty when nothing is stored yet
          type: string
        weekly:
          type: boolean
        weeks:
          items:
            $ref: "#/components/schemas/WeekRef"
          type: array
      required:
        - region
        - regions
        - week
        - weekly
        - hasWeekly
        - fetchedAt
        - weeks
        - entries
      type: object
    ChartEntry:
      properties:
        hasFile:
          description: Radarr already has the file
          type: boolean
        inRadarr:
          description: Radarr already tracks this movie (a request would be redundant)
          type: boolean
        item:
          $ref: "#/components/schemas/Item"
          description: Matched TMDB title; absent when no match was found
        position:
          format: int64
          type: integer
        title:
          type: string
        totalGross:
          format: int64
          type: integer
        weekendGross:
          description: USD (or the region's currency) for the weekend
          format: int64
          type: integer
        weeksInRelease:
          format: int64
          type: integer
      required:
        - position
        - title
        - weekendGross
        - totalGross
        - weeksInRelease
        - inRadarr
        - hasFile
      type: object
    CollectionDetail:
      properties:
        backdropPath:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
        overview:
          type: string
        parts:
          items:
            $ref: "#/components/schemas/Item"
          type: array
        posterPath:
          type: string
      required:
        - id
        - name
        - parts
      type: object
    CommentIssueRequest:
      properties:
        message:
          maxLength: 2000
          minLength: 1
          type: string
      required:
        - message
      type: object
    Counts:
      properties:
        failed:
          format: int64
          type: integer
        queued:
          format: int64
          type: integer
        ready:
          format: int64
          type: integer
        running:
          format: int64
          type: integer
      required:
        - queued
        - running
        - ready
        - failed
      type: object
    CreateIssueRequest:
      properties:
        episode:
          description: TV only, 0 = whole season
          format: int64
          minimum: 0
          type: integer
        kind:
          enum:
            - video
            - audio
            - subtitles
            - other
          type: string
        message:
          maxLength: 2000
          minLength: 1
          type: string
        season:
          description: TV only, 0 = whole show
          format: int64
          minimum: 0
          type: integer
        tmdbId:
          format: int64
          minimum: 1
          type: integer
        type:
          enum:
            - movie
            - tv
          type: string
      required:
        - type
        - tmdbId
        - kind
        - message
      type: object
    CreateRequestRequest:
      properties:
        qualityProfileId:
          description: Radarr/Sonarr quality profile to use (omit for the default); see /requests/options
          format: int64
          type: integer
        rootFolder:
          description: Root folder to use (omit for the default)
          type: string
        seasons:
          description: TV only; empty means every season
          items:
            format: int64
            type: integer
          type: array
        tmdbId:
          format: int64
          minimum: 1
          type: integer
        type:
          enum:
            - movie
            - tv
          type: string
      required:
        - type
        - tmdbId
      type: object
    CrewMember:
      properties:
        id:
          format: int64
          type: integer
        job:
          description: Director, Writer, Screenplay, Story, Novel, Editor, Producer, Composer, Cinematography, Creator
          type: string
        name:
          type: string
        profilePath:
          type: string
      required:
        - id
        - name
        - job
      type: object
    DeclineRequestRequest:
      properties:
        reason:
          maxLength: 500
          type: string
      type: object
    DemoLoginInputBody:
      properties:
        role:
          description: "admin: every right; user: a plain account"
          enum:
            - admin
            - user
          type: string
      required:
        - role
      type: object
    Detail:
      properties:
        availability:
          description: Library availability (filled by library sync)
          enum:
            - none
            - partial
            - available
          type: string
        backdropPath:
          type: string
        budget:
          format: int64
          type: integer
        cast:
          items:
            $ref: "#/components/schemas/CastMember"
          type: array
        collectionBackdropPath:
          type: string
        collectionId:
          format: int64
          type: integer
        collectionName:
          type: string
        countries:
          description: Production countries
          items:
            type: string
          type: array
        crew:
          description: Key crew (writers, editor, producers, composer...); creators for TV
          items:
            $ref: "#/components/schemas/CrewMember"
          type: array
        directors:
          items:
            $ref: "#/components/schemas/Person"
          type: array
        genreIds:
          items:
            format: int64
            type: integer
          type: array
        genres:
          items:
            $ref: "#/components/schemas/Genre"
          type: array
        homepage:
          type: string
        imdbId:
          type: string
        jellyfinItemId:
          description: Jellyfin id of the title when it is in the library (for links into the Jellyfin apps)
          type: string
        jellyfinServerId:
          description: Id of the Jellyfin server, with the item id enough to build a link into the Swiftfin app
          type: string
        keywords:
          description: TMDB tags such as "superhero"; searchable
          items:
            $ref: "#/components/schemas/Keyword"
          type: array
        languages:
          description: Spoken languages, English names
          items:
            type: string
          type: array
        monitored:
          description: Radarr (movie) already monitors this title and looks for it
          type: boolean
        numberOfEpisodes:
          format: int64
          type: integer
        numberOfSeasons:
          format: int64
          type: integer
        originalLanguage:
          type: string
        overview:
          type: string
        posterPath:
          description: TMDB path, load via /images/tmdb/{size}/{file}
          type: string
        recommendations:
          items:
            $ref: "#/components/schemas/Item"
          type: array
        releaseDate:
          type: string
        requestStatus:
          description: Set while an active request exists for this title
          enum:
            - pending
            - approved
          type: string
        revenue:
          format: int64
          type: integer
        reviews:
          description: A few TMDB user reviews
          items:
            $ref: "#/components/schemas/Review"
          type: array
        runtimeMinutes:
          format: int64
          type: integer
        seasons:
          items:
            $ref: "#/components/schemas/Season"
          type: array
        similar:
          items:
            $ref: "#/components/schemas/Item"
          type: array
        status:
          type: string
        studios:
          description: Production companies (movies) or networks (TV)
          items:
            type: string
          type: array
        tagline:
          type: string
        title:
          type: string
        tmdbId:
          format: int64
          type: integer
        trailerKey:
          description: YouTube video key of the official trailer
          type: string
        tvdbId:
          format: int64
          type: integer
        type:
          description: movie or tv
          enum:
            - movie
            - tv
          type: string
        voteAverage:
          format: double
          type: number
        voteCount:
          format: int64
          type: integer
        watchUrl:
          description: Deep link to the title in Jellyfin when it is in the library
          type: string
      required:
        - genres
        - cast
        - directors
        - crew
        - reviews
        - keywords
        - recommendations
        - similar
        - type
        - tmdbId
        - title
        - voteAverage
        - availability
      type: object
    DeviceSession:
      properties:
        appVersion:
          type: string
        createdAt:
          format: int64
          type: integer
        current:
          description: The session making this request
          type: boolean
        deviceName:
          type: string
        expiresAt:
          format: int64
          type: integer
        id:
          description: Opaque id, usable in DELETE /me/sessions/{id}
          type: string
        lastSeenAt:
          format: int64
          type: integer
        platform:
          enum:
            - web
            - ios
            - android
          type: string
        userAgent:
          type: string
      required:
        - id
        - platform
        - deviceName
        - appVersion
        - userAgent
        - createdAt
        - lastSeenAt
        - expiresAt
        - current
      type: object
    Episode:
      properties:
        airDate:
          type: string
        name:
          type: string
        number:
          format: int64
          type: integer
        overview:
          type: string
        runtimeMinutes:
          format: int64
          type: integer
        state:
          enum:
            - available
            - monitored
            - missing
          type: string
        stillPath:
          type: string
        voteAverage:
          format: double
          type: number
      required:
        - number
        - name
        - voteAverage
      type: object
    ErrorDetail:
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    Event:
      properties:
        at:
          description: Unix time of the step
          format: int64
          type: integer
        by:
          $ref: "#/components/schemas/UserRef"
          description: Who did it; absent when the server did
        kind:
          enum:
            - requested
            - approved
            - searching
            - downloading
            - available
            - declined
            - failed
          type: string
        note:
          description: The decline reason, or the error of a failed step (admins only)
          type: string
      required:
        - kind
        - at
      type: object
    Feed:
      properties:
        done:
          description: "True when there is nothing new left to show. No items and not done: trailers are still being prepared, ask again in a few seconds"
          type: boolean
        items:
          items:
            $ref: "#/components/schemas/Teaser"
          type: array
      required:
        - items
        - done
      type: object
    Flag:
      properties:
        group:
          enum:
            - admin
            - requests
            - auto-approve
            - issues
            - reserved
          type: string
        implies:
          description: Flags that come with this one and cannot be switched off while it is on
          items:
            type: string
          type: array
        name:
          type: string
        reserved:
          description: Defined so the numbers match Seerr; no feature uses it yet, hide it
          type: boolean
        value:
          format: int64
          type: integer
      required:
        - name
        - value
        - group
        - reserved
      type: object
    Flags:
      properties:
        blocklisted:
          type: boolean
        watchlisted:
          type: boolean
      required:
        - watchlisted
        - blocklisted
      type: object
    Genre:
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
      required:
        - id
        - name
      type: object
    GenreCount:
      properties:
        count:
          format: int64
          type: integer
        name:
          type: string
      required:
        - name
        - count
      type: object
    GetPermissionsResponse:
      properties:
        defaults:
          $ref: "#/components/schemas/PermissionDefaults"
        flags:
          items:
            $ref: "#/components/schemas/Flag"
          type: array
      required:
        - flags
        - defaults
      type: object
    Header:
      properties:
        name:
          maxLength: 100
          type: string
        value:
          maxLength: 2000
          type: string
      required:
        - name
        - value
      type: object
    Health:
      properties:
        breaker:
          $ref: "#/components/schemas/Breaker"
        cacheBytes:
          format: int64
          type: integer
        cacheLimitBytes:
          format: int64
          type: integer
        counts:
          $ref: "#/components/schemas/Counts"
        denoVersion:
          type: string
        ffmpegVersion:
          type: string
        lastError:
          type: string
        ok:
          type: boolean
        ytdlpVersion:
          type: string
      required:
        - ok
        - ytdlpVersion
        - denoVersion
        - ffmpegVersion
        - cacheBytes
        - cacheLimitBytes
        - counts
        - breaker
      type: object
    HealthOutputBody:
      properties:
        ok:
          type: boolean
      required:
        - ok
      type: object
    HistoryItem:
      properties:
        availability:
          description: Library availability (filled by library sync)
          enum:
            - none
            - partial
            - available
          type: string
        backdropPath:
          type: string
        genreIds:
          items:
            format: int64
            type: integer
          type: array
        overview:
          type: string
        posterPath:
          description: TMDB path, load via /images/tmdb/{size}/{file}
          type: string
        releaseDate:
          type: string
        requestStatus:
          description: Set while an active request exists for this title
          enum:
            - pending
            - approved
          type: string
        seenAt:
          description: Unix time of the swipe
          format: int64
          type: integer
        title:
          type: string
        tmdbId:
          format: int64
          type: integer
        type:
          description: movie or tv
          enum:
            - movie
            - tv
          type: string
        voteAverage:
          format: double
          type: number
      required:
        - seenAt
        - type
        - tmdbId
        - title
        - voteAverage
        - availability
      type: object
    HistorySource:
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    HistorySourcesBody:
      properties:
        sources:
          description: Accounts whose watch history this person's recommendations also use, with their own. Titles they watched are hidden from the recommendations too
          items:
            $ref: "#/components/schemas/HistorySource"
          type: array
      required:
        - sources
      type: object
    ImportUsersResponse:
      properties:
        created:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - created
        - total
      type: object
    InstanceBody:
      properties:
        animeRoot:
          description: Sonarr only. Omit to keep, empty string to clear
          type: string
        apiKey:
          description: Required when creating; omit on update to keep the saved key
          type: string
        genreRoots:
          additionalProperties:
            type: string
          description: Radarr only. Omit to keep the saved map, send {} to clear it
          type: object
        isDefault:
          type: boolean
        kind:
          enum:
            - radarr
            - sonarr
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        publicUrl:
          description: Omit to keep, empty string to clear. http(s)://host[:port]
          type: string
        qualityProfileId:
          format: int64
          minimum: 1
          type: integer
        rootFolder:
          minLength: 1
          type: string
        url:
          format: uri
          type: string
      required:
        - kind
        - name
        - url
        - qualityProfileId
        - rootFolder
        - isDefault
      type: object
    InstanceView:
      properties:
        animeRoot:
          description: "Sonarr only: root folder for anime (Animation + Japanese original language); such shows are also added with series type anime"
          type: string
        apiKeyConfigured:
          type: boolean
        genreRoots:
          additionalProperties:
            type: string
          description: "Radarr only: TMDB genre id -> root folder; the first matching genre of a movie wins"
          type: object
        id:
          type: string
        isDefault:
          type: boolean
        kind:
          enum:
            - radarr
            - sonarr
          type: string
        name:
          type: string
        publicUrl:
          description: Address people open the app at in their browser, used by links to it; empty = url
          type: string
        qualityProfileId:
          format: int64
          type: integer
        rootFolder:
          type: string
        url:
          type: string
      required:
        - id
        - kind
        - name
        - url
        - apiKeyConfigured
        - qualityProfileId
        - rootFolder
        - isDefault
        - publicUrl
        - animeRoot
        - genreRoots
      type: object
    IssueComment:
      properties:
        createdAt:
          format: int64
          type: integer
        id:
          type: string
        message:
          type: string
        user:
          $ref: "#/components/schemas/IssueUser"
      required:
        - id
        - user
        - message
        - createdAt
      type: object
    IssueCounts:
      properties:
        open:
          format: int64
          type: integer
        resolved:
          format: int64
          type: integer
      required:
        - open
        - resolved
      type: object
    IssueServarrSearchResponse:
      properties:
        dryRun:
          description: "Dry-run is on: nothing was sent to Radarr/Sonarr"
          type: boolean
      required:
        - dryRun
      type: object
    IssueThread:
      properties:
        commentCount:
          format: int64
          type: integer
        comments:
          items:
            $ref: "#/components/schemas/IssueComment"
          type: array
        createdAt:
          format: int64
          type: integer
        createdBy:
          $ref: "#/components/schemas/IssueUser"
        episode:
          format: int64
          type: integer
        id:
          type: string
        kind:
          enum:
            - video
            - audio
            - subtitles
            - other
          type: string
        posterPath:
          type: string
        resolvedBy:
          $ref: "#/components/schemas/IssueUser"
        season:
          format: int64
          type: integer
        status:
          enum:
            - open
            - resolved
          type: string
        title:
          type: string
        tmdbId:
          format: int64
          type: integer
        type:
          enum:
            - movie
            - tv
          type: string
        updatedAt:
          format: int64
          type: integer
      required:
        - comments
        - id
        - type
        - tmdbId
        - title
        - kind
        - status
        - createdBy
        - commentCount
        - createdAt
        - updatedAt
      type: object
    IssueUser:
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    IssueView:
      properties:
        commentCount:
          format: int64
          type: integer
        createdAt:
          format: int64
          type: integer
        createdBy:
          $ref: "#/components/schemas/IssueUser"
        episode:
          format: int64
          type: integer
        id:
          type: string
        kind:
          enum:
            - video
            - audio
            - subtitles
            - other
          type: string
        posterPath:
          type: string
        resolvedBy:
          $ref: "#/components/schemas/IssueUser"
        season:
          format: int64
          type: integer
        status:
          enum:
            - open
            - resolved
          type: string
        title:
          type: string
        tmdbId:
          format: int64
          type: integer
        type:
          enum:
            - movie
            - tv
          type: string
        updatedAt:
          format: int64
          type: integer
      required:
        - id
        - type
        - tmdbId
        - title
        - kind
        - status
        - createdBy
        - commentCount
        - createdAt
        - updatedAt
      type: object
    Item:
      properties:
        availability:
          description: Library availability (filled by library sync)
          enum:
            - none
            - partial
            - available
          type: string
        backdropPath:
          type: string
        genreIds:
          items:
            format: int64
            type: integer
          type: array
        overview:
          type: string
        posterPath:
          description: TMDB path, load via /images/tmdb/{size}/{file}
          type: string
        releaseDate:
          type: string
        requestStatus:
          description: Set while an active request exists for this title
          enum:
            - pending
            - approved
          type: string
        title:
          type: string
        tmdbId:
          format: int64
          type: integer
        type:
          description: movie or tv
          enum:
            - movie
            - tv
          type: string
        voteAverage:
          format: double
          type: number
      required:
        - type
        - tmdbId
        - title
        - voteAverage
        - availability
      type: object
    Keyword:
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
      required:
        - id
        - name
      type: object
    LdapImportBody:
      properties:
        connected:
          description: True when Tipsarr could sign in to the LDAP server with the imported settings
          type: boolean
        error:
          description: Why the connection test failed (the settings are saved anyway so they can be corrected)
          type: string
        ldapBaseDn:
          type: string
        ldapBindDn:
          type: string
        ldapUrl:
          type: string
      required:
        - ldapUrl
        - ldapBindDn
        - ldapBaseDn
        - connected
      type: object
    LibraryFacets:
      properties:
        genres:
          description: Most common first
          items:
            $ref: "#/components/schemas/GenreCount"
          type: array
        maxRuntimeMinutes:
          format: int64
          type: integer
