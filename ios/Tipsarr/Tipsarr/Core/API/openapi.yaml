          description: YYYY-MM
          type: string
        plays:
          format: int64
          type: integer
      required:
        - month
        - hours
        - plays
      type: object
    StatsPlugin:
      properties:
        hint:
          description: "Admins only: the Playback Reporting plugin is missing and would make these numbers exact"
          type: boolean
      required:
        - hint
      type: object
    StatsReport:
      properties:
        decades:
          items:
            $ref: "#/components/schemas/StatsBucket"
          type: array
        genres:
          items:
            $ref: "#/components/schemas/StatsBucket"
          type: array
        hoursOfDay:
          description: Hours per hour of the day (plugin source only)
          items:
            format: double
            type: number
          type: array
        months:
          description: Last 12 months, oldest first (plugin source only)
          items:
            $ref: "#/components/schemas/StatsMonth"
          type: array
        period:
          enum:
            - 30d
            - 12m
            - all
          type: string
        plugin:
          $ref: "#/components/schemas/StatsPlugin"
        requests:
          $ref: "#/components/schemas/StatsRequests"
        source:
          description: plugin = exact plays from Jellyfin's Playback Reporting; estimate = watch history x runtime
          enum:
            - plugin
            - estimate
          type: string
        top:
          description: Everything watched at least once, most time spent first (movies and shows together)
          items:
            $ref: "#/components/schemas/StatsTop"
          type: array
        topMovies:
          description: Most watched movies
          items:
            $ref: "#/components/schemas/StatsTop"
          type: array
        topShows:
          description: Most watched shows
          items:
            $ref: "#/components/schemas/StatsTop"
          type: array
        totals:
          $ref: "#/components/schemas/StatsTotals"
        user:
          description: A user id, or all
          type: string
        weekdays:
          description: Hours per weekday, Monday first (plugin source only)
          items:
            format: double
            type: number
          type: array
      required:
        - source
        - user
        - period
        - totals
        - genres
        - decades
        - months
        - weekdays
        - hoursOfDay
        - top
        - topMovies
        - topShows
        - requests
        - plugin
      type: object
    StatsRequests:
      properties:
        approved:
          format: int64
          type: integer
        available:
          format: int64
          type: integer
        declined:
          format: int64
          type: integer
        failed:
          format: int64
          type: integer
        made:
          format: int64
          type: integer
        pending:
          format: int64
          type: integer
      required:
        - made
        - pending
        - approved
        - available
        - declined
        - failed
      type: object
    StatsTop:
      properties:
        hours:
          format: double
          type: number
        plays:
          description: Play sessions; for a show every episode watched counts as one
          format: int64
          type: integer
        posterUrl:
          type: string
        rating:
          format: double
          type: number
        title:
          type: string
        tmdbId:
          format: int64
          type: integer
        type:
          enum:
            - movie
            - tv
          type: string
        year:
          format: int64
          type: integer
      required:
        - type
        - tmdbId
        - title
        - plays
        - hours
      type: object
    StatsTotals:
      properties:
        hours:
          format: double
          type: number
        movies:
          format: int64
          type: integer
        plays:
          format: int64
          type: integer
        shows:
          format: int64
          type: integer
        titles:
          format: int64
          type: integer
      required:
        - titles
        - movies
        - shows
        - plays
        - hours
      type: object
    Status:
      properties:
        everySeconds:
          format: int64
          type: integer
        lastFinishedAt:
          format: int64
          type: integer
        lastStartedAt:
          format: int64
          type: integer
        message:
          type: string
        messageArgs:
          items:
            type: string
          type: array
        messageCode:
          type: string
        messageParams:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        running:
          type: boolean
        status:
          type: string
      required:
        - everySeconds
        - running
        - name
        - lastStartedAt
        - lastFinishedAt
        - status
        - message
      type: object
    StatusFeatures:
      properties:
        push:
          description: Push notifications are set up on this server
          type: boolean
        teasers:
          description: "The Teasers feed is available: trailer files are on and the resolver answers. Apps hide the Teasers tab otherwise"
          type: boolean
      required:
        - push
        - teasers
      type: object
    StatusOutputBody:
      properties:
        apiVersion:
          format: int64
          type: integer
        db:
          description: "Database engine: sqlite, postgres or mysql"
          type: string
        defaultLanguage:
          type: string
        demo:
          description: "This server is a throwaway public demo sandbox: one-click sign-in, actions that reach other services are refused (demo_disabled)"
          type: boolean
        dryRun:
          description: When true nothing is ever sent to Radarr/Sonarr
          type: boolean
        features:
          $ref: "#/components/schemas/StatusFeatures"
        minAppVersion:
          type: string
        version:
          type: string
      required:
        - version
        - db
        - dryRun
        - demo
        - defaultLanguage
        - apiVersion
        - minAppVersion
        - features
      type: object
    SyncStatusBody:
      properties:
        canSync:
          description: True when a Jellyfin API key is saved
          type: boolean
        jobs:
          items:
            $ref: "#/components/schemas/Status"
          type: array
        movies:
          description: Movies currently known in the Jellyfin library
          format: int64
          type: integer
        shows:
          description: Shows currently known in the Jellyfin library
          format: int64
          type: integer
      required:
        - canSync
        - movies
        - shows
        - jobs
      type: object
    Teaser:
      properties:
        availability:
          description: Library availability (filled by library sync)
          enum:
            - none
            - partial
            - available
          type: string
        backdropPath:
          type: string
        genreIds:
          items:
            format: int64
            type: integer
          type: array
        overview:
          type: string
        posterPath:
          description: TMDB path, load via /images/tmdb/{size}/{file}
          type: string
        releaseDate:
          type: string
        requestStatus:
          description: Set while an active request exists for this title
          enum:
            - pending
            - approved
          type: string
        title:
          type: string
        tmdbId:
          format: int64
          type: integer
        trailerKey:
          description: YouTube video key of the trailer, in the person's language when there is one
          type: string
        type:
          description: movie or tv
          enum:
            - movie
            - tv
          type: string
        videoHeight:
          format: int64
          type: integer
        videoUrl:
          description: Trailer file served by this server (needs the same login as the API)
          type: string
        voteAverage:
          format: double
          type: number
        watchlisted:
          type: boolean
      required:
        - trailerKey
        - watchlisted
        - videoUrl
        - type
        - tmdbId
        - title
        - voteAverage
        - availability
      type: object
    TeaserFilesTestRequest:
      properties:
        key:
          description: YouTube video key; default is a short public video
          type: string
      type: object
    TeaserHistoryResponse:
      properties:
        items:
          items:
            $ref: "#/components/schemas/HistoryItem"
          type: array
        total:
          description: How many titles the history holds in all
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    TeaserSeenRequest:
      properties:
        tmdbId:
          format: int64
          minimum: 1
          type: integer
        type:
          enum:
            - movie
            - tv
          type: string
      required:
        - type
        - tmdbId
      type: object
    TestResult:
      properties:
        bytes:
          format: int64
          type: integer
        duration:
          format: int64
          type: integer
        error:
          type: string
        height:
          format: int64
          type: integer
        key:
          type: string
        seconds:
          description: How long the resolver took (or how long we waited)
          format: double
          type: number
        status:
          enum:
            - queued
            - running
            - ready
            - failed
          type: string
      required:
        - key
        - status
        - seconds
        - bytes
        - height
        - duration
      type: object
    TokenBody:
      properties:
        expiresAt:
          description: Unix seconds; every use renews it, see sessions
          format: int64
          type: integer
        token:
          description: "Send as Authorization: Bearer <token>"
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - expiresAt
        - user
      type: object
    TokenInputBody:
      properties:
        appVersion:
          maxLength: 32
          type: string
        deviceName:
          description: Shown in the signed-in devices list
          maxLength: 64
          type: string
        password:
          maxLength: 512
          type: string
        platform:
          description: Which app is signing in
          enum:
            - ios
            - android
          type: string
        username:
          maxLength: 256
          minLength: 1
          type: string
      required:
        - username
        - password
        - platform
      type: object
    UpdateRequestOptionsRequest:
      properties:
        qualityProfileId:
          description: Omit for the instance default
          format: int64
          type: integer
        rootFolder:
          description: Empty for the instance default
          type: string
      type: object
    UpdateSettingsInputBody:
      properties:
        apiKeyEnabled:
          description: Turn the read-only dashboard key on (a key is created if there is none) or off (the key is deleted)
          type: boolean
        appPublicUrl:
          description: http(s)://host[/path]; empty clears it
          type: string
        boxofficeRegions:
          description: Comma-separated region codes; empty resets to US
          type: string
        defaultLanguage:
          description: e.g. fr-FR; empty clears it
          type: string
        jellyfinApiKey:
          description: Jellyfin API key (Dashboard > API Keys); empty string clears it
          type: string
        jellyfinPublicUrl:
          description: Empty string clears it
          type: string
        ldapBaseDn:
          type: string
        ldapBindDn:
          type: string
        ldapBindPassword:
          description: Write-only
          type: string
        ldapUrl:
          description: Empty string turns LDAP pictures off; the connection is tested when saving
          type: string
        oidcAdminGroup:
          type: string
        oidcClientId:
          type: string
        oidcClientSecret:
          description: Write-only; empty string clears it
          type: string
        oidcGroupsClaim:
          type: string
        oidcIssuer:
          description: Empty string turns single sign-on off. The provider is contacted when saving
          type: string
        oidcUsernameClaim:
          description: Empty string = preferred_username
          type: string
        pushEnabled:
          description: Needs the relay address and key; turning it on with either missing is refused
          type: boolean
        pushRelayKey:
          description: Write-only; empty string clears it (and turns push off)
          type: string
        pushRelayUrl:
          description: Empty string clears it (and turns push off)
          type: string
        pushText:
          type: boolean
        regenerateApiKey:
          description: "True: replace the dashboard key with a new one (the old one stops working)"
          type: boolean
        servarrAutoImport:
          type: boolean
        teasersFilesEnabled:
          description: Needs the resolver address and key; turning it on with either missing is refused
          type: boolean
        teasersFilesKey:
          description: Write-only; empty string clears it (and turns trailer files off)
          type: string
        teasersFilesMaxHeight:
          description: 360, 480, 720 or 1080
          format: int64
          type: integer
        teasersFilesUrl:
          description: Empty string clears it (and turns trailer files off)
          type: string
        tmdbApiKey:
          description: Set or replace the TMDB key (empty string clears it)
          type: string
      type: object
    UpdateUserRequest:
      properties:
        discordId:
          description: Discord user id, empty to clear
          pattern: ^[0-9]{0,20}$
          type: string
        language:
          description: e.g. fr or fr-FR, empty to clear
          type: string
        permissions:
          format: int64
          type: integer
        quota:
          $ref: "#/components/schemas/UserQuota"
        region:
          description: 2-letter country code, empty to clear
          type: string
        role:
          enum:
            - admin
            - user
          type: string
        telegramChatId:
          description: Telegram chat id, empty to clear
          pattern: ^-?[0-9]{0,20}$
          type: string
      type: object
    UpdateWebhookEgressRequest:
      properties:
        allowedHosts:
          description: host, host:port or CIDR, e.g. ntfy.lan, 192.168.1.20:8123, 10.0.0.0/24
          items:
            type: string
          maxItems: 50
          type: array
      required:
        - allowedHosts
      type: object
    User:
      properties:
        createdAt:
          format: int64
          type: integer
        discordId:
          type: string
        effectivePermissions:
          format: int64
          type: integer
        id:
          type: string
        language:
          type: string
        lastLoginAt:
          format: int64
          type: integer
        movieQuotaDays:
          format: int64
          type: integer
        movieQuotaLimit:
          format: int64
          type: integer
        name:
          type: string
        permissions:
          format: int64
          type: integer
        ratingSource:
          type: string
        region:
          type: string
        role:
          type: string
        telegramChatId:
          type: string
        tvQuotaDays:
          format: int64
          type: integer
        tvQuotaLimit:
          format: int64
          type: integer
      required:
        - id
        - name
        - role
        - region
        - language
        - ratingSource
        - discordId
        - telegramChatId
        - createdAt
        - lastLoginAt
        - permissions
        - effectivePermissions
      type: object
    UserQuota:
      properties:
        movieDays:
          format: int64
          maximum: 3650
          minimum: 0
          type: integer
        movieLimit:
          format: int64
          maximum: 100000
          minimum: 0
          type: integer
        tvDays:
          format: int64
          maximum: 3650
          minimum: 0
          type: integer
        tvLimit:
          format: int64
          maximum: 100000
          minimum: 0
          type: integer
      type: object
    UserRef:
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    Variable:
      properties:
        description:
          description: Localized description
          type: string
        empty:
          description: Not filled for this event
          type: boolean
        example:
          description: Value with the sample data (empty when Empty)
          type: string
        path:
          description: Liquid path, e.g. media.title
          type: string
        perRecipient:
          description: Only filled with one delivery per recipient
          type: boolean
        type:
          description: Value type
          enum:
            - string
            - number
            - boolean
          type: string
      required:
        - path
        - type
        - example
        - description
        - empty
        - perRecipient
      type: object
    View:
      properties:
        createdAt:
          format: int64
          type: integer
        decidedBy:
          $ref: "#/components/schemas/UserRef"
        declineReason:
          type: string
        dryRun:
          description: "Approved in dry-run mode: nothing was sent to Radarr/Sonarr"
          type: boolean
        error:
          type: string
        events:
          description: What happened to the request and when, oldest first. Requests older than this history show an approximate one
          items:
            $ref: "#/components/schemas/Event"
          type: array
        id:
          type: string
        posterPath:
          type: string
        progress:
          $ref: "#/components/schemas/Progress"
        qualityProfileId:
          description: Chosen quality profile (absent = the instance default)
          format: int64
          type: integer
        releaseDate:
          type: string
        requestedBy:
          $ref: "#/components/schemas/UserRef"
        rootFolder:
          description: Chosen root folder (absent = the instance default)
          type: string
        seasonProgress:
          description: "Shows only: completion per season"
          items:
            $ref: "#/components/schemas/SeasonProgress"
          type: array
        seasons:
          items:
            format: int64
            type: integer
          type: array
        source:
          description: Set when the request was imported from what Radarr/Sonarr already monitor
          type: string
        stage:
          description: User-facing lifecycle step
          enum:
            - requested
            - approved
            - searching
            - downloading
            - available
            - declined
            - failed
          type: string
        status:
          enum:
            - pending
            - approved
            - declined
            - failed
            - available
          type: string
        title:
          type: string
        tmdbId:
          format: int64
          type: integer
        type:
          enum:
            - movie
            - tv
          type: string
        uhd:
          description: The quality profile allows 4K (2160p); absent when not (and from servers older than 4K requests)
          type: boolean
        updatedAt:
          format: int64
          type: integer
      required:
        - id
        - type
        - tmdbId
        - title
        - status
        - stage
        - requestedBy
        - dryRun
        - createdAt
        - updatedAt
      type: object
    WebhookBody:
      properties:
        authSecret:
          description: Bearer token or basic password (write-only). Empty string clears it; omit to keep it
          maxLength: 512
          type: string
        authType:
          enum:
            - none
            - bearer
            - basic
            - ""
          type: string
        authUsername:
          maxLength: 191
          type: string
        enabled:
          type: boolean
        events:
          description: Any of request.created, request.approved, request.auto_approved, request.declined, request.failed, media.available, issue.created, issue.commented, issue.resolved, issue.reopened; empty means all. request.approved also receives request.auto_approved
          items:
            type: string
          type: array
        headers:
          items:
            $ref: "#/components/schemas/Header"
          maxItems: 20
          type: array
        name:
          maxLength: 100
          minLength: 1
          type: string
        perRecipient:
          type: boolean
        preset:
          maxLength: 32
          type: string
        secret:
          description: Signing secret (write-only). Empty string clears it; omit to keep it
          type: string
        template:
          description: Liquid body template; empty = the raw JSON envelope
          maxLength: 20000
          type: string
        url:
          description: http(s) URL; may contain Liquid, rendered per delivery
          maxLength: 512
          minLength: 1
          type: string
      required:
        - name
        - url
        - enabled
      type: object
    WebhookEgress:
      properties:
        allowedHosts:
          description: "Private targets webhooks may reach: host, host:port or CIDR"
          items:
            type: string
          type: array
        blocked:
          description: Saved webhooks whose URL the policy refuses now
          items:
            $ref: "#/components/schemas/WebhookRef"
          type: array
      required:
        - allowedHosts
        - blocked
      type: object
    WebhookInputBody:
      properties:
        ItemType:
          type: string
        NotificationType:
          description: Jellyfin webhook plugin event, e.g. PlaybackStop or ItemAdded
          type: string
        UserId:
          type: string
      type: object
    WebhookPreview:
      properties:
        body:
          type: string
        delivered:
          description: "Test only: whether the receiver accepted it"
          type: boolean
        deliveryError:
          description: "Test only: why the delivery failed"
          type: string
        error:
          description: Template or URL problem; nothing else is set then
          type: string
        headers:
          description: Secrets are masked
          items:
            $ref: "#/components/schemas/Header"
          type: array
        url:
          type: string
        validJson:
          type: boolean
      required:
        - url
        - headers
        - body
        - validJson
      type: object
    WebhookRef:
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    WebhookView:
      properties:
        authSecretConfigured:
          description: A bearer token or basic password is saved (write-only)
          type: boolean
        authType:
          enum:
            - none
            - bearer
            - basic
          type: string
        authUsername:
          type: string
        blockedByPolicy:
          description: The URL points at a private or local address the outbound policy refuses (see /admin/webhooks/egress)
          type: boolean
        enabled:
          type: boolean
        events:
          description: Subscribed events; empty means all
          items:
            type: string
          type: array
        headers:
          items:
            $ref: "#/components/schemas/Header"
          type: array
        id:
          type: string
        name:
          type: string
        perRecipient:
          description: One delivery per concerned person, with notifyUser filled
          type: boolean
        preset:
          description: Preset the webhook was made from (informative)
          type: string
        secretConfigured:
          description: A signing secret is saved (HMAC-SHA256 in X-Tipsarr-Signature)
          type: boolean
        template:
          description: Liquid body template; empty = the raw JSON envelope
          type: string
        url:
          description: May contain Liquid ({{ ... }})
          type: string
      required:
        - id
        - name
        - url
        - events
        - enabled
        - secretConfigured
        - preset
        - template
        - headers
        - authType
        - authUsername
        - authSecretConfigured
        - perRecipient
        - blockedByPolicy
      type: object
    WeekRef:
      properties:
        end:
          description: Last day covered, YYYY-MM-DD
          type: string
        key:
          description: Week key; weekly charts end with a "w"
          type: string
        label:
          type: string
        start:
          description: First day covered, YYYY-MM-DD
          type: string
        weekly:
          description: Full Monday-Sunday week instead of the Friday-Sunday weekend
          type: boolean
      required:
        - key
        - label
        - weekly
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
    session:
      in: cookie
      name: tipsarr_session
      type: apiKey
info:
  title: Tipsarr
  version: 0.1.0
openapi: 3.0.3
paths:
  /admin/boxoffice/alias:
    delete:
      operationId: deleteBoxOfficeAlias
      parameters:
        - explode: false
          in: query
          name: title
          required: true
          schema:
            maxLength: 255
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
        - bearer: []
      summary: Remove a manual match and match automatically again (admin)
      tags:
        - admin
    put:
      description: Fixes titles the automatic search matched wrongly or not at all. Applies to every stored week and to future charts.
      operationId: setBoxOfficeAlias
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBoxOfficeAliasRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - session: []
        - bearer: []
      summary: Pin a box-office title to a TMDB movie (admin)
      tags:
        - admin
  /admin/ldap/import-jellyfin:
    post:
