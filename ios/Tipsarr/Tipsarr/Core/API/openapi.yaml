      parameters:
        - description: "The shared secret (preferred: a header does not end up in proxy and access logs)"
          in: header
          name: X-Tipsarr-Token
          schema:
            description: "The shared secret (preferred: a header does not end up in proxy and access logs)"
            type: string
        - description: "Deprecated (will be removed in a future major version): the same secret in the address, still accepted so existing set-ups keep working, but addresses end up in logs"
          explode: false
          in: query
          name: token
          schema:
            description: "Deprecated (will be removed in a future major version): the same secret in the address, still accepted so existing set-ups keep working, but addresses end up in logs"
            type: string
