name: CI

on:
  push:
    branches: [master, rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: t, POSTGRES_PASSWORD: t, POSTGRES_DB: t }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U t" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env: { MYSQL_USER: t, MYSQL_PASSWORD: t, MYSQL_DATABASE: t, MYSQL_ROOT_PASSWORD: r }
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -ptr" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TIPSARR_TEST_PG_URL: postgres://t:t@localhost:5432/t?sslmode=disable
      TIPSARR_TEST_MYSQL_URL: mysql://t:t@localhost:3306/t
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # SQLite always; PostgreSQL and MySQL through the service containers above.
      - run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:i18n
      - run: npm run build

  generated-api-is-current:
    # The TypeScript client and the mobile spec (api/openapi.yaml) are generated from the backend's OpenAPI spec; fail if they drifted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25
      - run: make generate
      - run: git diff --exit-code -- frontend/src/lib/api api design/generated ios/Tipsarr/Tipsarr/Core/API/openapi.yaml ios/Tipsarr/Tipsarr/DesignSystem/Tokens.swift backend/internal/i18n/locales android/app/src/main/res android/app/src/main/java/com/brebond/tipsarr/core/support/GeneratedLanguages.kt

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: tipsarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
