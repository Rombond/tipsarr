name: CI

on:
  push:
    branches: [master, rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: t, POSTGRES_PASSWORD: t, POSTGRES_DB: t }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U t" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env: { MYSQL_USER: t, MYSQL_PASSWORD: t, MYSQL_DATABASE: t, MYSQL_ROOT_PASSWORD: r }
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -ptr" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TIPSARR_TEST_PG_URL: postgres://t:t@localhost:5432/t?sslmode=disable
      TIPSARR_TEST_MYSQL_URL: mysql://t:t@localhost:3306/t
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # SQLite always; PostgreSQL and MySQL through the service containers above.
      - run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:i18n
      - run: npm run build

  generated-api-is-current:
    # The TypeScript client and the mobile spec (api/openapi.yaml) are generated from the backend's OpenAPI spec; fail if they drifted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25
      - run: make generate
      - run: git diff --exit-code -- frontend/src/lib/api api design/generated ios/Tipsarr/Tipsarr/Core/API/openapi.yaml ios/Tipsarr/Tipsarr/DesignSystem/Tokens.swift backend/internal/i18n/locales android/app/src/main/res android/app/src/main/java/com/brebond/tipsarr/core/support/GeneratedLanguages.kt

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: tipsarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
