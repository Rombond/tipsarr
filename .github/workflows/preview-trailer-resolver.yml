name: Preview trailer-resolver image

# Testable resolver image before a release (amd64 only, unsigned):
#   push to develop touching trailer-resolver/ -> ghcr.io/<owner>/trailer-resolver:develop
# Releases stay in release-trailer-resolver.yml: tags resolver-vX.Y.Z publish :X.Y.Z, :X.Y and :latest.
on:
  push:
    branches: [develop]
    paths: ['trailer-resolver/**', '.github/workflows/preview-trailer-resolver.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-trailer-resolver
  cancel-in-progress: true

jobs:
  image:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: tag
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/trailer-resolver:develop" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: trailer-resolver
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: |
            type=gha,scope=preview-resolver
            type=gha
          cache-to: type=gha,mode=max,scope=preview-resolver
      - name: Summary
        run: echo "Image \`${{ steps.tag.outputs.image }}\` (${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
