name: Issue labels

# "Closes #N" only closes issues when a PR targets the default branch (master).
# PRs into develop: label the referenced issues fixed-in-develop so agents and people know the fix exists.
# Release PR develop -> master: close every fixed-in-develop issue and drop the label.

on:
  pull_request:
    types: [closed]
    branches: [develop, master]

permissions:
  issues: write

jobs:
  label-fixed:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const text = `${pr.title}\n${pr.body ?? ''}`;
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;
            const nums = [...new Set([...text.matchAll(re)].map((m) => Number(m[1])))];
            for (const issue_number of nums) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
              if (issue.pull_request || issue.state === 'closed') continue;
              await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: ['fixed-in-develop'] });
              await github.rest.issues.createComment({ ...context.repo, issue_number,
                body: `Fixed on \`develop\` by #${pr.number} (${pr.merge_commit_sha.slice(0, 7)}). Closes with the next release.` });
              core.info(`labeled #${issue_number}`);
            }

  close-released:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref == 'master' && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const issues = await github.paginate(github.rest.issues.listForRepo,
              { ...context.repo, state: 'open', labels: 'fixed-in-develop', per_page: 100 });
            for (const issue of issues) {
              if (issue.pull_request) continue;
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number,
                body: `Released via #${pr.number}.` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: 'fixed-in-develop' }).catch(() => {});
              core.info(`closed #${issue.number}`);
            }
