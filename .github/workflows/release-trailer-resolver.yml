name: Release trailer-resolver image

# Publishes ghcr.io/<owner>/trailer-resolver when a resolver tag is pushed, e.g. `git tag resolver-v0.1.0 && git push --tags`.
# Separate from the Tipsarr release so the two images version independently.
on:
  push:
    tags: ['resolver-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/trailer-resolver
          tags: |
            type=match,pattern=resolver-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=resolver-v(\d+\.\d+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/resolver-v') }}
      - uses: docker/build-push-action@v6
        with:
          context: trailer-resolver
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
