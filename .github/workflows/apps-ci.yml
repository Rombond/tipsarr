name: Apps CI

# Builds the iOS and Android apps without signing or publishing anything.
# DISABLED for now: only a manual run is possible. To enable on PRs, replace `on:` with:
#
#   on:
#     pull_request:
#       paths: ['ios/**', 'android/**', 'locales/**', 'api/**', 'design/**', '.github/workflows/apps-ci.yml']
#     workflow_dispatch:
#
# Needs the secret GOOGLE_SERVICES_JSON (base64 of android/app/google-services.json): the google-services
# Gradle plugin is always applied. iOS needs Xcode 27.2 on the macOS runner image (check actions/runner-images);
# otherwise use a self-hosted runner on the Mac.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
      # Release (unsigned) catches resources removed by the shrinker, which debug does not (see 831b453).
      - run: ./gradlew --no-daemon assembleRelease lint testDebugUnitTest

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
      - name: Build for the simulator (no signing)
        run: |
          xcodebuild build \
            -project ios/Tipsarr/Tipsarr.xcodeproj -scheme Tipsarr -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
